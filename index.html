<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/08afa5152d.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>

    <section class="container">
        
        <h1>To-Do List</h1>

        <label for="taskInput"> 
            <section class="inputContainer">
                <input type="text" id="taskInput" class="taskInput" placeholder="Add your task...">
                <button id="taskSubmit" class="taskSubmit" title="Create" onclick="taskCreate()">Create</button>
            </section>
        </label>
        <section class="taskContainer" id="taskContainer">
            <hr class="hr">

        </section>


    </section>  
</main>





    <script src="index.js"></script>
    
</body>
</html>
